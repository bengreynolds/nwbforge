[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nwbforge"
version = "0.1.0"
description = "Contracts and services for guided NWB conversion workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ben Reynolds" }
]
dependencies = [
  "neuroconv>=0.9,<0.10",
  "nwbinspector>=0.7,<0.8",
  "PySide6>=6.8,<6.11",
  "pynwb>=3.1,<4",
]

[project.optional-dependencies]
audio = [
  "ndx-sound>=0.2,<0.3",
  "scipy>=1.13,<2",
]
alphaomega = [
  "neuroconv[alphaomega]>=0.9,<0.10",
]
axon = [
  "spikeinterface>=0.103,<0.104",
]
axona = [
  "neuroconv[axona]>=0.9,<0.10",
]
blackrock = [
  "neuroconv[blackrock]>=0.9,<0.10",
]
deeplabcut = [
  "ndx-pose>=0.2,<0.3",
]
edf = [
  "spikeinterface>=0.103,<0.104",
  "pyedflib>=0.1,<0.2",
]
intan = [
  "neuroconv[intan]>=0.9,<0.10",
]
neuralynx = [
  "neuroconv[neuralynx]>=0.9,<0.10",
]
lightningpose = [
  "ndx-pose>=0.2,<0.3",
  "opencv-python-headless>=4.10,<5",
]
medpc = [
  "neuroconv[medpc]>=0.9,<0.10",
]
excel = [
  "openpyxl>=3.1,<4",
]
hdf5 = [
  "h5py>=3.10,<4",
  "roiextractors>=0.6,<0.8",
]
image = [
  "pillow>=10,<12",
]
micromanager = [
  "neuroconv[micromanagertiff]>=0.9,<0.10",
]
miniscope = [
  "neuroconv[miniscope]>=0.9,<0.10",
]
sleap = [
  "neuroconv[sleap]>=0.9,<0.10",
]
thor = [
  "neuroconv[thor]>=0.9,<0.10",
]
openephys_binary = [
  "spikeinterface>=0.103,<0.104",
]
openephys_legacy = [
  "neuroconv[openephys]>=0.9,<0.10",
]
plexon = [
  "neuroconv[plexon]>=0.9,<0.10",
]
spikegadgets = [
  "spikeinterface>=0.103,<0.104",
]
spikeglx = [
  "spikeinterface>=0.103,<0.104",
]
tdt = [
  "neuroconv[tdt]>=0.9,<0.10",
]
videos = [
  "opencv-python-headless>=4.10,<5",
]
viewer_rich = [
  "nwbwidgets>=0.11,<0.12",
  "panel>=1.8,<2",
]
whitematter = [
  "neuroconv[whitematter]>=0.9,<0.10",
]
scanimage = [
  "neuroconv[scanimage]>=0.9,<0.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
