[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nwbforge"
version = "0.1.0"
description = "Contracts and services for guided NWB conversion workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ben Reynolds" }
]
dependencies = [
  "neuroconv>=0.9,<0.10",
  "nwbinspector>=0.7,<0.8",
  "openpyxl>=3.1,<4",
  "pynwb>=3.1,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
